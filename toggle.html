<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>More Less Example</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .box {
            width: 500px;
            margin: 100px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Computer Science</h2>

    <p>
        Computer Science is the study of computers and computational systems.
    </p>

    <!-- Extra paragraph -->
    <p id="moreText">
        It includes programming, software development, databases, networking,
        artificial intelligence, cybersecurity, web development, machine
        learning, cloud computing and data science.
    </p>

    <!-- Buttons -->
    <button id="moreBtn" class="btn btn-primary">
        More
    </button>


</div>


<script>

$(document).ready(function () {

    $("#moreText").hide();

    // More button
    $("#moreBtn").click(function () {

        $("#moreText").toggle();

    });
   

});

</script>

</body>

</html>
