<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fade In Fade Out</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            text-align: center;
            margin-top: 100px;
        }

        #box {
            width: 400px;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <div id="box" class="alert alert-primary">
        <h3>Hello!</h3>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. 
            Nobis rerum eaque corrupti asperiores eum, hic magnam 
            illo id reprehenderit deserunt eos adipisci, 
            sint molestiae unde quisquam est! Voluptate, a delectus?</p>
    </div>

    <button id="fadeout" class="btn btn-danger">
        Fade Out
    </button>

    <button id="fadein" class="btn btn-success">
        Fade In
    </button>

    <button id="toggle" class="btn btn-success">
      Toggle
    </button>

    <script>
        $(document).ready(function() {

            $("#fadeout").click(function() {
                $("#box").fadeOut(1000);
            });

            $("#fadein").click(function() {
                $("#box").fadeIn(1000);
            });

            $("#toggle").click(function() {
                $("#box").toggle(1000);
             });
        });
    </script>

</body>
</html>
