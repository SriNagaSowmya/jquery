<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slide Up and Slide Down</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            background-color: lightgray;
        }

        .box {
            width: 400px;
            margin: 100px auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">

        <div id="text" class="alert alert-primary">
            <h3>Good moring!</h3>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Delectus impedit, accusamus 
                fugiat nesciunt cum ducimus optio error.
                 Laudantium quam ipsam minus, eaque, molestiae, mollitia inventore ratione fugit eos explicabo ea?.</p>
        </div>

        <button id="up" class="btn btn-danger">
            Slide Up
        </button>

        <button id="down" class="btn btn-success">
            Slide Down
        </button>

        <button id="toggle" class="btn btn-success">
            Toggle
        </button>

    </div>


    <!-- jQuery Code -->
    <script>
        $(document).ready(function() {

            $("#up").click(function() {
                $("#text").slideUp(3000);
            });

            $("#down").click(function() {
                $("#text").slideDown(1000);
            });

            $("#toggle").click(function(){
                $("#text").toggle(1000);
            });

        });
    </script>

</body>
</html>
